<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Kit - Digital Umami</title>
    <link rel="icon" href="assets/images/logo.ico" type="x-icon">
    <link rel="stylesheet" href="https://use.typekit.net/jsx5cbs.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .presskit-container {
            max-width: 1000px;
            margin: 100px auto 40px auto;
            padding: 40px 30px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #efefef;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .presskit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .presskit-title-group h1 {
            font-size: 2.4rem;
            margin-bottom: 6px;
            color: #fff;
        }

        .presskit-title-group p {
            color: #aaa;
            font-size: 1.05rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff70a5 0%, #ff477e 100%);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 112, 165, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 112, 165, 0.5);
            background: linear-gradient(135deg, #ff85b3 0%, #ff5c8d 100%);
        }

        .game-logo-display {
            max-width: 280px;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 35px 0 15px 0;
            color: #ff70a5;
            border-left: 4px solid #ff70a5;
            padding-left: 12px;
        }

        .description-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 24px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 1.05rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: pre-wrap;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .gallery-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 112, 165, 0.5);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-info {
            padding: 12px 15px;
            font-size: 0.9rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gallery-item-info a {
            color: #ff70a5;
            text-decoration: none;
            font-weight: bold;
        }

        .gallery-item-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .presskit-container {
                margin: 90px 15px 30px 15px;
                padding: 25px 18px;
            }

            .presskit-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <!-- Background -->
    <div class="background-image" id="bg-img" style="background-image: url('assets/images/background.png');"></div>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo-link">
            <img src="assets/images/logo.png" alt="Digital Umami" class="logo" id="logo">
        </a>
        <nav class="header-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="blog.html" class="nav-link">Blog</a>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="presskit-container">
        <div class="presskit-header">
            <div class="presskit-title-group">
                <h1 id="game-title">Press Kit</h1>
                <p id="game-subtitle">Official Press Kit & Media Assets</p>
            </div>
            <a href="#" id="download-zip-btn" class="download-btn" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download All (.ZIP)
            </a>
        </div>

        <div id="logo-container">
            <!-- Game logo dynamically injected -->
        </div>

        <div class="section-title">Overview & Fact Sheet</div>
        <div class="description-box" id="game-description">
            Loading presskit information...
        </div>

        <div class="section-title">Media & Screenshots</div>
        <div class="gallery-grid" id="media-gallery">
            <!-- Dynamic gallery -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div style="display: flex; gap: 5%; align-items: center;">
            <a href="mailto:digitalumamigames@gmail.com" class="footer-email">digitalumamigames@gmail.com</a>
        </div>
        <div class="footer-buttons">
            <a href="privacy-policy.html" class="footer-btn">Privacy Policy</a>
        </div>
    </footer>

    <script>
        const pressKits = {
            'amc': {
                title: 'Animal Mystery Crew',
                subtitle: 'Official Press Kit',
                bg: 'assets/images/amc/background.png',
                zipPath: 'assets/presskit_amc/amc_presskit.zip',
                logo: 'assets/presskit_amc/gamelogo.png',
                readme: `Developer: Digital Umami
Release Date: Wishlist Now on Steam!
Website: https://digitalumami.github.io/amc.html
Steam: https://store.steampowered.com/app/3883040/Animal_Mystery_Crew/
Contact: digitalumamigames@gmail.com

Overview:
Our Steam page is live! You can now wishlist Animal Mystery Crew and help us reach more players. Join our mystery crew as we uncover secrets, solve puzzles, and continue developing the game!`,
                media: [
                    { name: 'Store Capsule Header', path: 'assets/presskit_amc/store_capsule_header.png' },
                    { name: 'Screenshot 1', path: 'assets/presskit_amc/screen0.png' },
                    { name: 'Screenshot 2', path: 'assets/presskit_amc/screen1.png' },
                    { name: 'Screenshot 3', path: 'assets/presskit_amc/screen2.png' },
                    { name: 'Screenshot 4', path: 'assets/presskit_amc/screen3.png' },
                    { name: 'Screenshot 5', path: 'assets/presskit_amc/screen4.png' },
                    { name: 'The Book (GIF)', path: 'assets/presskit_amc/TheBook.gif' },
                    { name: 'The Frog Guy (GIF)', path: 'assets/presskit_amc/TheFrogGuy.gif' }
                ]
            },
            'gambleinc': {
                title: 'Gamble Inc.',
                subtitle: 'Official Press Kit',
                bg: 'assets/images/gmbl/background.png',
                zipPath: 'assets/presskit_gambleinc/gambleinc_presskit.zip',
                logo: 'assets/presskit_gambleinc/gamelogo.png',
                readme: `Developer: Digital Umami
Release Date: Wishlist Now on Steam!
Website: https://digitalumami.github.io/gmbl.html
Steam: https://store.steampowered.com/app/4632620/Gamble_Inc/
Contact: digitalumamigames@gmail.com

Overview:
Tired of making money for your corporate overlords while you get paid peanuts? Hack into your work computer and syphon cash straight from the slots and into your bank. In this corporate dystopia jobs have been reduced to betting all you've got and letting the house (your boss) win. Now Hiring!`,
                media: [
                    { name: 'Capsule Header (Strategy)', path: 'assets/presskit_gambleinc/store_capsule_header_border_strat.png' },
                    { name: 'Capsule Main (Strategy)', path: 'assets/presskit_gambleinc/store_capsule_main_border_strat.png' },
                    { name: 'Gameplay 1', path: 'assets/presskit_gambleinc/gameplay_sc (1).jpg' },
                    { name: 'Gameplay 2', path: 'assets/presskit_gambleinc/gameplay_sc (2).jpg' },
                    { name: 'Gameplay 3', path: 'assets/presskit_gambleinc/gameplay_sc (3).jpg' },
                    { name: 'Gameplay 4', path: 'assets/presskit_gambleinc/gameplay_sc (4).jpg' },
                    { name: 'Gameplay 5', path: 'assets/presskit_gambleinc/gameplay_sc (5).jpg' }
                ]
            }
        };

        // Get game query param (e.g. ?game=amc or ?game=gambleinc)
        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game') || 'amc';
        const data = pressKits[gameKey] || pressKits['amc'];

        // Populate elements
        document.title = `${data.title} Press Kit - Digital Umami`;
        document.getElementById('game-title').textContent = `${data.title} Press Kit`;
        document.getElementById('game-subtitle').textContent = data.subtitle;
        document.getElementById('bg-img').style.backgroundImage = `url('${data.bg}')`;
        document.getElementById('download-zip-btn').href = data.zipPath;
        document.getElementById('game-description').textContent = data.readme;

        if (data.logo) {
            document.getElementById('logo-container').innerHTML = `<img src="${data.logo}" alt="${data.title} Logo" class="game-logo-display">`;
        }

        const galleryEl = document.getElementById('media-gallery');
        galleryEl.innerHTML = '';
        data.media.forEach(item => {
            const card = document.createElement('div');
            card.className = 'gallery-item';
            card.innerHTML = `
                <img src="${item.path}" alt="${item.name}" loading="lazy">
                <div class="gallery-item-info">
                    <span>${item.name}</span>
                    <a href="${item.path}" download target="_blank">View / Download</a>
                </div>
            `;
            galleryEl.appendChild(card);
        });
    </script>
</body>

</html>
